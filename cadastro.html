<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dent Lab - Cadastro</title>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="https://unpkg.com/flickity@2/dist/flickity.min.css">
    <link rel="stylesheet" href="./css/index.css">
    <script src="https://kit.fontawesome.com/6cde816448.js" crossorigin="anonymous"></script>
    <script defer src="./js/register.js"></script>
</head>
<body>
    <nav class="teto">
        <a href="">
            <ul class="logo">
                <li> <img id="logo__image" src="./Imagens/logo.svg" alt="Logo"> </li>
                <li> <h1 class="titulo__logo"> Dent<span>Lab</span> </h1> </li>
            </ul>
        </a>
        <ul class="menu">
            <li> <a href="index.html">HOME</a> </li>
            <li> <a class="login" href="login.html">LOGIN</a> </li>
        </ul>
    </nav>
    
    <section class="area__formulario">
        <img class="imagem__login" src="./Imagens/dentist-clinic.svg" alt="Dent Lab">
            <form action="">
                <h1 class="titulo_form">Olá👋, tudo bem?</h1> <!-- Cabeçalho do formulário -->
                <p class="texto_form">Entre com seu e-mail e senha no nosso sistema.</p> <!-- Descrição -->

                <label for="name">Usuário</label> <!-- Texto que aparece acima do input -->
                <input id="name" type="text" placeholder="Usuário" required> <!-- Campo de texto para o usuário -->

                <label for="email">E-mail</label> <!-- Texto do campo e-mail -->
                <input id="email" type="email" placeholder="E-mail" required> <!-- Campo de e-mail -->

                <label for="password">Senha</label> <!-- Texto do campo senha -->
                <input id="password" type="password" placeholder="Senha" required> <!-- Campo senha (oculto) -->

                <label for="confirmPassword">Confirmar Senha</label> <!-- Texto do campo confirmar senha -->
                <input id="confirmPassword" type="password" placeholder="Senha" required> <!-- Campo confirmar senha -->

                <button id="registerButton">CADASTRAR-SE</button> <!-- Botão de envio do formulário -->
            </form>
    </section>
</body>
</html>
